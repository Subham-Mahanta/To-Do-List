<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHub - TodoList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TaskHub - Your central hub for getting things done.</h1>
    <p>Edit by double clicking the specific To-Do.</p>
    <div class="input-container">
        <input type="text" id="todo-input" placeholder="Enlist a To-Do by pressing Add or Enter">
        <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <script src="script.js"></script>
</body>
</html>
